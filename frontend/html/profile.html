<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Profile - MediAssist</title>
    <link rel="stylesheet" href="../styles/index.css">
    <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-slate-50 text-slate-800">

    <div class="container mx-auto px-6 py-10">
        <h1 class="text-3xl font-bold mb-6">My Profile</h1>

        <!-- User Details Section -->
        <div class="bg-white p-6 rounded-lg shadow-md mb-8">
            <h2 class="text-xl font-semibold mb-4">My Details</h2>
            <div id="user-details" class="text-gray-700">
                <p>Loading details...</p>
            </div>
        </div>

        <!-- Appointments Section -->
        <div class="bg-white p-6 rounded-lg shadow-md">
            <h2 class="text-xl font-semibold mb-4">My Appointments</h2>
            <div class="overflow-x-auto">
                <table class="min-w-full bg-white">
                    <thead>
                        <tr>
                            <th class="py-2 px-4 border-b text-left">Doctor</th>
                            <th class="py-2 px-4 border-b text-left">Date</th>
                            <th class="py-2 px-4 border-b text-left">Time</th>
                            <th class="py-2 px-4 border-b text-left">Status</th>
                        </tr>
                    </thead>
                    <tbody id="appointments-list">
                        <tr>
                            <td colspan="4" class="py-4 text-center text-gray-500">Loading appointments...</td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>

        <!-- Logout Button -->
        <div class="mt-8 text-center">
            <button onclick="logout()"
                class="bg-red-600 text-white px-6 py-2 rounded-lg hover:bg-red-700">Logout</button>
        </div>
    </div>

    <script src="../scripts/profile.js"></script>
</body>

</html>
